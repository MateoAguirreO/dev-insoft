<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 670" width="1160" height="670" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Leads · Diagrama de componentes</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .cont { fill: #f6f8fb; stroke: #374151; stroke-width: 1.5; }
    .comp { fill: #ffffff; stroke: #374151; stroke-width: 1.3; }
    .inner { fill: #eef2f7; stroke: #9ca3af; stroke-width: 1; }
    .opc { fill: #ffffff; stroke: #374151; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .fuera { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .t1 { font-size: 15px; font-weight: 700; fill: #111827; }
    .t2 { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .d { font-size: 11px; fill: #4b5563; }
    .di { font-size: 11px; fill: #6b7280; font-style: italic; }
    .arr { stroke: #374151; stroke-width: 1.4; fill: none; marker-end: url(#flecha); }
    .lbl { font-size: 11px; fill: #374151; }
    .lblb { font-size: 11px; font-weight: 700; fill: #111827; }
  </style>
  <rect x="0" y="0" width="1160" height="670" fill="#ffffff"/>
  <text x="40" y="36" font-size="18" font-weight="700" fill="#111827">Leads · Diagrama de componentes</text>
  <text x="1120" y="36" font-size="11" fill="#6b7280" text-anchor="end">Ambiente: local · configuración C (solo servicio)</text>

  <!-- ===================== consumidores ===================== -->
  <rect class="opc" x="40" y="110" width="220" height="86" rx="6"/>
  <text class="t2" x="56" y="134">ISW-Leads</text>
  <text class="d" x="56" y="153">Cliente web · Astro + Svelte</text>
  <text class="di" x="56" y="183">En el alcance según decisión D6</text>

  <rect class="comp" x="40" y="220" width="220" height="70" rx="6"/>
  <text class="t2" x="56" y="244">Postman</text>
  <text class="d" x="56" y="263">Colección de pruebas del API</text>

  <path class="arr" d="M260 153 H403"/>
  <path class="arr" d="M260 255 H330 V190 H403"/>
  <text class="lblb" x="320" y="143" text-anchor="middle">HTTP · JSON</text>
  <text class="lbl" x="350" y="176" text-anchor="middle">Bearer JWT</text>

  <!-- ===================== fuera de alcance ===================== -->
  <rect class="fuera" x="40" y="330" width="220" height="250" rx="6"/>
  <text class="t2" x="56" y="356">Fuera de alcance (esta fase)</text>
  <text class="d" x="56" y="384">• Validar firma y vigencia del JWT</text>
  <text class="d" x="56" y="406">• Login y emisión de tokens</text>
  <text class="d" x="56" y="428">• Permisos y seguridad de datos</text>
  <text class="d" x="56" y="450">• Auditoría de registros</text>
  <text class="d" x="56" y="472">• Consolidar leads</text>
  <text class="d" x="56" y="494">• Envío real de correos</text>
  <text class="d" x="56" y="516">• Caché en Azure Tables</text>
  <text class="d" x="56" y="538">• Log de peticiones en Blob Storage</text>
  <text class="d" x="56" y="560">• Despliegue a Azure</text>

  <!-- ===================== ISS-Leads ===================== -->
  <rect class="cont" x="380" y="70" width="420" height="450" rx="8"/>
  <text class="t1" x="398" y="96">ISS-Leads</text>
  <text class="d" x="398" y="114">Azure Functions v4 · Node.js + TypeScript · PostgreSQL vía ISPBDSQL</text>

  <!-- handlers -->
  <rect class="comp" x="405" y="128" width="370" height="80" rx="6"/>
  <text class="t2 mono" x="420" y="149">src/functions/</text>
  <text class="d" x="540" y="149">Handlers HTTP</text>
  <text class="d mono" x="420" y="170">registerCatalogoGenAzureFunction(TLeadController)</text>
  <text class="d" x="420" y="186">Rutas anidadas de mensajes por lead</text>
  <text class="di" x="420" y="201">Solo enrutan y delegan: sin lógica de negocio</text>

  <path class="arr" d="M590 208 V248"/>
  <text class="lbl" x="600" y="232">instancia y delega</text>

  <!-- controladores -->
  <rect class="comp" x="405" y="250" width="370" height="128" rx="6"/>
  <text class="t2 mono" x="420" y="271">src/sources/020 Controllers/</text>
  <rect class="inner" x="417" y="280" width="346" height="42" rx="4"/>
  <text class="t2 mono" x="428" y="297">TLeadController</text>
  <text class="d" x="428" y="314">CRUD · verificar · listar · duplicar · recodificar · correos</text>
  <rect class="inner" x="417" y="328" width="346" height="42" rx="4"/>
  <text class="t2 mono" x="428" y="345">TLeadMensajeController</text>
  <text class="d" x="428" y="362">Registrar · listar · obtener (movimiento, no se edita)</text>

  <path class="arr" d="M590 378 V410"/>
  <text class="lbl" x="600" y="398">usa</text>

  <!-- objetos -->
  <rect class="comp" x="405" y="412" width="370" height="92" rx="6"/>
  <text class="t2 mono" x="420" y="433">src/sources/010 Objetos/</text>
  <text class="d mono" x="420" y="454">TLead        extiende TObject</text>
  <text class="d mono" x="420" y="472">TLeadCorreo  extiende TObject</text>
  <text class="d mono" x="420" y="490">TLeadMensaje extiende TObject</text>

  <!-- ===================== paquetes base ===================== -->
  <path class="arr" d="M800 240 H868"/>
  <text class="lblb" x="834" y="231" text-anchor="middle">npm</text>

  <rect class="cont" x="870" y="70" width="250" height="342" rx="8"/>
  <text class="t1" x="886" y="96">Paquetes base InSoft</text>
  <text class="d" x="886" y="114">@ingenieria_insoft/* · privados</text>

  <rect class="comp" x="884" y="124" width="222" height="58" rx="5"/>
  <text class="t2" x="896" y="142">ISPAzureUtils</text>
  <text class="d mono" x="896" y="159">TContextUser · TControllerServer</text>
  <text class="d mono" x="896" y="174">registerCatalogoGen…</text>

  <rect class="comp" x="884" y="188" width="222" height="44" rx="5"/>
  <text class="t2" x="896" y="206">ISPBDSQL</text>
  <text class="d mono" x="896" y="223">GetConnection · TDBPostgres</text>

  <rect class="comp" x="884" y="238" width="222" height="44" rx="5"/>
  <text class="t2" x="896" y="256">ISPServer</text>
  <text class="d mono" x="896" y="273">RstExitosa · Rst4xx · RstError</text>

  <rect class="comp" x="884" y="288" width="222" height="44" rx="5"/>
  <text class="t2" x="896" y="306">ISPNodeJS</text>
  <text class="d mono" x="896" y="323">varEnv · UUID</text>

  <rect class="comp" x="884" y="338" width="222" height="58" rx="5"/>
  <text class="t2" x="896" y="356">ISPGen</text>
  <text class="d mono" x="896" y="373">TObject · TArray</text>
  <text class="d mono" x="896" y="388">val2Str · val2Int · val2Date</text>

  <!-- ===================== PostgreSQL ===================== -->
  <path class="arr" d="M995 412 V470"/>
  <text class="lbl" x="1005" y="438">driver pg</text>
  <text class="lbl" x="1005" y="453">DB_ENGINE=PG</text>

  <path d="M870 488 V570 A125 15 0 0 0 1120 570 V488" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <ellipse cx="995" cy="488" rx="125" ry="15" fill="#eef2f7" stroke="#374151" stroke-width="1.4"/>
  <text class="t2" x="995" y="526" text-anchor="middle">PostgreSQL 18 (local)</text>
  <text class="d mono" x="995" y="545" text-anchor="middle">leads · leads_correos</text>
  <text class="d mono" x="995" y="561" text-anchor="middle">leads_mensajes</text>

  <!-- ===================== convenciones ===================== -->
  <rect x="40" y="606" width="1080" height="44" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <line x1="56" y1="628" x2="106" y2="628" stroke="#374151" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text class="lbl" x="116" y="632">Llamada o dependencia</text>
  <rect x="290" y="618" width="40" height="20" fill="#ffffff" stroke="#374151" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="lbl" x="340" y="632">Componente opcional o fuera de alcance</text>
  <text class="lbl" x="600" y="626">Bearer JWT: solo se define el contrato; el servicio no lo valida ni lo usa.</text>
  <text class="lbl" x="600" y="641">Conexión a BD: variables DB_* en local.settings.json (no versionado).</text>
</svg>
