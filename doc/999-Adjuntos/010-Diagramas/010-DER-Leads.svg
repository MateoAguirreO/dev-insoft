<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" width="1080" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Leads · Diagrama entidad-relación (PostgreSQL)</title>
  <style>
    .box { fill: #ffffff; stroke: #374151; stroke-width: 1.4; }
    .head { fill: #dbe4ee; stroke: #374151; stroke-width: 1.4; }
    .tname { font-size: 15px; font-weight: 700; fill: #111827; font-family: Consolas, 'Courier New', monospace; }
    .ttype { font-size: 11px; fill: #4b5563; }
    .col { font-size: 12px; fill: #111827; font-family: Consolas, 'Courier New', monospace; }
    .typ { font-size: 11.5px; fill: #4b5563; font-family: Consolas, 'Courier New', monospace; }
    .sep { stroke: #e5e7eb; stroke-width: 1; }
    .pk { fill: #1f2937; }
    .pktxt { font-size: 9px; font-weight: 700; fill: #ffffff; }
    .aud { fill: #f3f4f6; }
    .audtxt { font-size: 11.5px; fill: #374151; font-style: italic; }
    .rel { stroke: #374151; stroke-width: 1.4; fill: none; }
    .relref { stroke: #6b7280; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
    .lbl { font-size: 11px; fill: #374151; }
    .lblb { font-size: 11px; font-weight: 700; fill: #111827; }
    .grp { font-size: 11px; font-weight: 700; fill: #6b7280; letter-spacing: 0.6px; }
    .legend { font-size: 11px; fill: #374151; }
  </style>
  <rect x="0" y="0" width="1080" height="860" fill="#ffffff"/>
  <text x="40" y="36" font-size="18" font-weight="700" fill="#111827">Leads · Diagrama entidad-relación</text>
  <text x="1040" y="36" font-size="11" fill="#6b7280" text-anchor="end">Motor: PostgreSQL 18 (local) · auditoría Modelo B</text>

  <!-- ===================== leads ===================== -->
  <rect class="box" x="40" y="60" width="340" height="286"/>
  <rect class="head" x="40" y="60" width="340" height="44"/>
  <text class="tname" x="52" y="80">leads</text>
  <text class="ttype" x="52" y="97">Datos · entidad principal</text>
  <rect class="pk" x="48" y="108" width="26" height="14" rx="3"/><text class="pktxt" x="61" y="118.5" text-anchor="middle">PK</text>
  <text class="col" x="82" y="119">ilead</text><text class="typ" x="368" y="119" text-anchor="end">bigint NOT NULL</text>
  <line class="sep" x1="40" y1="126" x2="380" y2="126"/>
  <text class="col" x="82" y="141">nombre</text><text class="typ" x="368" y="141" text-anchor="end">varchar(100)</text>
  <line class="sep" x1="40" y1="148" x2="380" y2="148"/>
  <text class="col" x="82" y="163">empresa</text><text class="typ" x="368" y="163" text-anchor="end">varchar(100)</text>
  <line class="sep" x1="40" y1="170" x2="380" y2="170"/>
  <text class="col" x="82" y="185">cargo</text><text class="typ" x="368" y="185" text-anchor="end">varchar(50)</text>
  <line class="sep" x1="40" y1="192" x2="380" y2="192"/>
  <text class="col" x="82" y="207">telefono</text><text class="typ" x="368" y="207" text-anchor="end">varchar(50)</text>
  <line class="sep" x1="40" y1="214" x2="380" y2="214"/>
  <text class="col" x="82" y="229">ciudad</text><text class="typ" x="368" y="229" text-anchor="end">varchar(50)</text>
  <line class="sep" x1="40" y1="236" x2="380" y2="236"/>
  <text class="col" x="82" y="251">origen</text><text class="typ" x="368" y="251" text-anchor="end">varchar(50)</text>
  <line class="sep" x1="40" y1="258" x2="380" y2="258"/>
  <text class="col" x="82" y="273">iestado</text><text class="typ" x="368" y="273" text-anchor="end">smallint</text>
  <line class="sep" x1="40" y1="280" x2="380" y2="280"/>
  <text class="col" x="82" y="295">observaciones</text><text class="typ" x="368" y="295" text-anchor="end">text</text>
  <line class="sep" x1="40" y1="302" x2="380" y2="302"/>
  <text class="col" x="82" y="317">bactivo</text><text class="typ" x="368" y="317" text-anchor="end">boolean</text>
  <rect class="aud" x="40.7" y="324.7" width="338.6" height="20.6"/>
  <line class="sep" x1="40" y1="324" x2="380" y2="324"/>
  <text class="audtxt" x="82" y="339">auditoría: creación y modificación · 10 columnas</text>

  <!-- ===================== leads_correos ===================== -->
  <rect class="box" x="680" y="60" width="330" height="110"/>
  <rect class="head" x="680" y="60" width="330" height="44"/>
  <text class="tname" x="692" y="80">leads_correos</text>
  <text class="ttype" x="692" y="97">Detalle de leads · sin auditoría</text>
  <rect class="pk" x="688" y="108" width="26" height="14" rx="3"/><text class="pktxt" x="701" y="118.5" text-anchor="middle">PK</text>
  <text class="col" x="722" y="119">ilead</text><text class="typ" x="998" y="119" text-anchor="end">bigint NOT NULL</text>
  <line class="sep" x1="680" y1="126" x2="1010" y2="126"/>
  <rect class="pk" x="688" y="130" width="26" height="14" rx="3"/><text class="pktxt" x="701" y="140.5" text-anchor="middle">PK</text>
  <text class="col" x="722" y="141">email</text><text class="typ" x="998" y="141" text-anchor="end">varchar(100) NOT NULL</text>
  <line class="sep" x1="680" y1="148" x2="1010" y2="148"/>
  <text class="col" x="722" y="163">bprincipal</text><text class="typ" x="998" y="163" text-anchor="end">boolean</text>

  <!-- ===================== leads_mensajes ===================== -->
  <rect class="box" x="680" y="240" width="330" height="198"/>
  <rect class="head" x="680" y="240" width="330" height="44"/>
  <text class="tname" x="692" y="260">leads_mensajes</text>
  <text class="ttype" x="692" y="277">Movimiento · se registra, no se modifica</text>
  <rect class="pk" x="688" y="288" width="26" height="14" rx="3"/><text class="pktxt" x="701" y="298.5" text-anchor="middle">PK</text>
  <text class="col" x="722" y="299">imensaje</text><text class="typ" x="998" y="299" text-anchor="end">bigint NOT NULL</text>
  <line class="sep" x1="680" y1="306" x2="1010" y2="306"/>
  <text class="col" x="722" y="321">ilead</text><text class="typ" x="998" y="321" text-anchor="end">bigint</text>
  <line class="sep" x1="680" y1="328" x2="1010" y2="328"/>
  <text class="col" x="722" y="343">email</text><text class="typ" x="998" y="343" text-anchor="end">varchar(100)</text>
  <line class="sep" x1="680" y1="350" x2="1010" y2="350"/>
  <text class="col" x="722" y="365">asunto</text><text class="typ" x="998" y="365" text-anchor="end">varchar(255)</text>
  <line class="sep" x1="680" y1="372" x2="1010" y2="372"/>
  <text class="col" x="722" y="387">cuerpo</text><text class="typ" x="998" y="387" text-anchor="end">text</text>
  <line class="sep" x1="680" y1="394" x2="1010" y2="394"/>
  <text class="col" x="722" y="409">fhenvio</text><text class="typ" x="998" y="409" text-anchor="end">timestamptz</text>
  <rect class="aud" x="680.7" y="416.7" width="328.6" height="20.6"/>
  <line class="sep" x1="680" y1="416" x2="1010" y2="416"/>
  <text class="audtxt" x="722" y="431">auditoría: solo creación · 5 columnas</text>

  <!-- ===================== relaciones de leads ===================== -->
  <!-- leads 1 : N leads_correos -->
  <path class="rel" d="M380 115 H680"/>
  <line class="rel" x1="392" y1="107" x2="392" y2="123"/>
  <line class="rel" x1="398" y1="107" x2="398" y2="123"/>
  <circle cx="657" cy="115" r="5" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <path class="rel" d="M666 115 L680 107 M666 115 L680 123 M666 115 H680"/>
  <text class="lbl" x="414" y="106"><tspan class="lblb">1 : N</tspan> · un lead tiene 0..N correos</text>

  <!-- leads 1 : N leads_mensajes -->
  <circle cx="520" cy="115" r="3" fill="#374151"/>
  <path class="rel" d="M520 115 V321 H680"/>
  <circle cx="657" cy="321" r="5" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <path class="rel" d="M666 321 L680 313 M666 321 L680 329 M666 321 H680"/>
  <text class="lblb" x="530" y="194">1 : N</text>
  <text class="lbl" x="530" y="210">un lead registra 0..N mensajes</text>

  <!-- referencia de validación: leads_mensajes(ilead, email) -> leads_correos(ilead, email) -->
  <path class="relref" d="M1010 343 H1044 V137 H1010"/>
  <path d="M1010 137 L1019 132 L1019 142 Z" fill="#6b7280"/>
  <text class="lbl" x="1034" y="192" text-anchor="end">destinatario: debe existir en</text>
  <text class="lbl" x="1034" y="207" text-anchor="end">leads_correos al registrar;</text>
  <text class="lbl" x="1034" y="222" text-anchor="end">queda como copia histórica</text>

  <!-- ===================== seguridad del API ===================== -->
  <line x1="40" y1="466" x2="1010" y2="466" stroke="#e5e7eb" stroke-width="1"/>
  <text class="grp" x="40" y="486">SEGURIDAD DEL API</text>

  <!-- seg_usuarios -->
  <rect class="box" x="40" y="500" width="340" height="154"/>
  <rect class="head" x="40" y="500" width="340" height="44"/>
  <text class="tname" x="52" y="520">seg_usuarios</text>
  <text class="ttype" x="52" y="537">Datos · usuarios que inician sesión</text>
  <rect class="pk" x="48" y="548" width="26" height="14" rx="3"/><text class="pktxt" x="61" y="558.5" text-anchor="middle">PK</text>
  <text class="col" x="82" y="559">iusuario</text><text class="typ" x="368" y="559" text-anchor="end">varchar(30) NOT NULL</text>
  <line class="sep" x1="40" y1="566" x2="380" y2="566"/>
  <text class="col" x="82" y="581">nombre</text><text class="typ" x="368" y="581" text-anchor="end">varchar(100)</text>
  <line class="sep" x1="40" y1="588" x2="380" y2="588"/>
  <text class="col" x="82" y="603">clave</text><text class="typ" x="368" y="603" text-anchor="end">varchar(255) · hash scrypt</text>
  <line class="sep" x1="40" y1="610" x2="380" y2="610"/>
  <text class="col" x="82" y="625">bactivo</text><text class="typ" x="368" y="625" text-anchor="end">boolean</text>
  <rect class="aud" x="40.7" y="632.7" width="338.6" height="20.6"/>
  <line class="sep" x1="40" y1="632" x2="380" y2="632"/>
  <text class="audtxt" x="82" y="647">auditoría: creación y modificación · 10 columnas</text>

  <!-- seg_sesiones -->
  <rect class="box" x="680" y="500" width="330" height="132"/>
  <rect class="head" x="680" y="500" width="330" height="44"/>
  <text class="tname" x="692" y="520">seg_sesiones</text>
  <text class="ttype" x="692" y="537">Movimiento · una fila por inicio de sesión</text>
  <rect class="pk" x="688" y="548" width="26" height="14" rx="3"/><text class="pktxt" x="701" y="558.5" text-anchor="middle">PK</text>
  <text class="col" x="722" y="559">isesion</text><text class="typ" x="998" y="559" text-anchor="end">bigint NOT NULL</text>
  <line class="sep" x1="680" y1="566" x2="1010" y2="566"/>
  <text class="col" x="722" y="581">iusuario</text><text class="typ" x="998" y="581" text-anchor="end">varchar(30)</text>
  <line class="sep" x1="680" y1="588" x2="1010" y2="588"/>
  <text class="col" x="722" y="603">fhvence</text><text class="typ" x="998" y="603" text-anchor="end">timestamptz</text>
  <rect class="aud" x="680.7" y="610.7" width="328.6" height="20.6"/>
  <line class="sep" x1="680" y1="610" x2="1010" y2="610"/>
  <text class="audtxt" x="722" y="625">auditoría: solo creación · 5 columnas</text>

  <!-- seg_usuarios 1 : N seg_sesiones -->
  <path class="rel" d="M380 559 H540 V581 H680"/>
  <line class="rel" x1="392" y1="551" x2="392" y2="567"/>
  <line class="rel" x1="398" y1="551" x2="398" y2="567"/>
  <circle cx="657" cy="581" r="5" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <path class="rel" d="M666 581 L680 573 M666 581 L680 589 M666 581 H680"/>
  <text class="lbl" x="414" y="550"><tspan class="lblb">1 : N</tspan> · un usuario abre 0..N sesiones</text>

  <!-- ===================== convenciones ===================== -->
  <rect x="40" y="690" width="970" height="152" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <rect class="pk" x="52" y="702" width="26" height="14" rx="3"/><text class="pktxt" x="65" y="712.5" text-anchor="middle">PK</text>
  <text class="legend" x="86" y="713">Llave primaria: única columna NOT NULL. ilead, imensaje e isesion los asigna el controlador con secuencias (sin IDENTITY ni serial).</text>
  <text class="legend" x="86" y="732">iusuario es la llave natural del usuario y se guarda en minúscula.</text>
  <line class="rel" x1="52" y1="756" x2="112" y2="756"/>
  <line class="rel" x1="58" y1="749" x2="58" y2="763"/>
  <line class="rel" x1="63" y1="749" x2="63" y2="763"/>
  <circle cx="92" cy="756" r="4" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <path class="rel" d="M100 756 L112 749 M100 756 L112 763"/>
  <text class="legend" x="122" y="760">Uno a cero o muchos. Relación lógica: no hay llaves foráneas en la BD; la integridad la valida el controlador.</text>
  <line class="relref" x1="52" y1="782" x2="112" y2="782"/>
  <text class="legend" x="122" y="786">Referencia que se valida solo al registrar el mensaje (no se mantiene si el correo cambia después).</text>
  <rect class="aud" x="52" y="802" width="60" height="14" stroke="#9ca3af" stroke-width="1"/>
  <text class="legend" x="122" y="813">Auditoría Modelo B: …cre = iusuariocre varchar(30), iappcre varchar(20), iequipocre int, ipcre varchar(20), fhcre timestamptz; …ult, las mismas.</text>
  <text class="legend" x="122" y="831">La estampa el servidor con la sesión del token; iusuariocre e iusuarioult guardan un iusuario (relación lógica con seg_usuarios).</text>
</svg>
