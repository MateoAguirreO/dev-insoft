<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" width="1120" height="1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Leads · Secuencia de la sesión</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .part { fill: #dbe4ee; stroke: #374151; stroke-width: 1.4; }
    .t2 { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .d { font-size: 11px; fill: #4b5563; }
    .vida { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 5; }
    .msg { stroke: #374151; stroke-width: 1.3; fill: none; marker-end: url(#flecha); }
    .ret { stroke: #374151; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; marker-end: url(#flecha); }
    .lbl { font-size: 11.5px; fill: #111827; }
    .lblr { font-size: 11.5px; fill: #374151; }
    .fase { fill: #f3f4f6; }
    .fasetxt { font-size: 12px; font-weight: 700; fill: #111827; }
    .nota { fill: #fff8e6; stroke: #d4a72c; stroke-width: 1; }
    .notatxt { font-size: 11px; fill: #4b3a0a; }
    .fin { font-size: 11px; fill: #6b7280; font-style: italic; }
  </style>
  <rect x="0" y="0" width="1120" height="1000" fill="#ffffff"/>
  <text x="40" y="36" font-size="18" font-weight="700" fill="#111827">Leads · Secuencia de la sesión</text>
  <text x="1080" y="36" font-size="11" fill="#6b7280" text-anchor="end">JWT HS256 · 8 horas · jti = isesion</text>

  <!-- ===================== participantes ===================== -->
  <rect class="part" x="40" y="60" width="160" height="44" rx="4"/>
  <text class="t2" x="120" y="79" text-anchor="middle">Consumidor</text>
  <text class="d" x="120" y="96" text-anchor="middle">Postman · ISW-Leads</text>

  <rect class="part" x="300" y="60" width="240" height="44" rx="4"/>
  <text class="t2 mono" x="420" y="79" text-anchor="middle">TUsuarioController</text>
  <text class="d" x="420" y="96" text-anchor="middle">y TSistemaLeads (ISS-Leads)</text>

  <rect class="part" x="610" y="60" width="220" height="44" rx="4"/>
  <text class="t2 mono" x="720" y="79" text-anchor="middle">TSesionController</text>
  <text class="d" x="720" y="96" text-anchor="middle">sesiones y JWT</text>

  <rect class="part" x="900" y="60" width="200" height="44" rx="4"/>
  <text class="t2" x="1000" y="79" text-anchor="middle">PostgreSQL 18</text>
  <text class="d mono" x="1000" y="96" text-anchor="middle">seg_usuarios · seg_sesiones</text>

  <line class="vida" x1="120" y1="104" x2="120" y2="980"/>
  <line class="vida" x1="420" y1="104" x2="420" y2="980"/>
  <line class="vida" x1="720" y1="104" x2="720" y2="980"/>
  <line class="vida" x1="1000" y1="104" x2="1000" y2="980"/>

  <!-- ===================== 1. inicio de sesión ===================== -->
  <rect class="fase" x="20" y="118" width="1080" height="22"/>
  <text class="fasetxt" x="32" y="133">1. Inicio de sesión · POST /api/sesiones (público)</text>

  <path class="msg" d="M120 168 H418"/>
  <text class="lbl" x="135" y="162">POST /api/sesiones { usuario, clave }</text>

  <path class="msg" d="M420 200 H998"/>
  <text class="lbl" x="435" y="194">busca hash de la clave y bactivo</text>
  <path class="ret" d="M1000 226 H422"/>
  <text class="lblr" x="985" y="220" text-anchor="end">hash · bactivo</text>

  <rect class="nota" x="430" y="240" width="200" height="26" rx="3"/>
  <text class="notatxt" x="440" y="257">compara la clave con scrypt</text>

  <path class="ret" d="M420 292 H122"/>
  <text class="lblr" x="405" y="286" text-anchor="end">si falla: 401 Usuario o clave incorrectos</text>

  <path class="msg" d="M420 330 H718"/>
  <text class="lbl" x="435" y="324">abrir(iusuario, iapp, iequipo)</text>

  <path class="msg" d="M720 362 H998"/>
  <text class="lbl" x="735" y="356">INSERT seg_sesiones (vence en 8 h)</text>

  <rect class="nota" x="730" y="376" width="240" height="40" rx="3"/>
  <text class="notatxt" x="740" y="392">firma el JWT HS256 con JWT_SECRET</text>
  <text class="notatxt" x="740" y="408">jti = isesion · exp = fhvence</text>

  <path class="ret" d="M720 438 H422"/>
  <text class="lblr" x="705" y="432" text-anchor="end">token · fhvence</text>
  <path class="ret" d="M420 466 H122"/>
  <text class="lblr" x="405" y="460" text-anchor="end">201 { token, fhvence, usuario }</text>

  <!-- ===================== 2. operación con token ===================== -->
  <rect class="fase" x="20" y="490" width="1080" height="22"/>
  <text class="fasetxt" x="32" y="505">2. Cualquier otra operación · Authorization: Bearer &lt;token&gt;</text>

  <path class="msg" d="M120 540 H418"/>
  <text class="lbl" x="135" y="534">operación con Authorization: Bearer &lt;token&gt;</text>

  <path class="msg" d="M420 572 H718"/>
  <text class="lbl" x="435" y="566">verificarToken(token)</text>

  <rect class="nota" x="730" y="586" width="260" height="26" rx="3"/>
  <text class="notatxt" x="740" y="603">verifica firma y vencimiento (jsonwebtoken)</text>

  <path class="msg" d="M720 636 H998"/>
  <text class="lbl" x="735" y="630">sesión del jti vigente · usuario activo</text>

  <path class="ret" d="M720 662 H422"/>
  <text class="lblr" x="705" y="656" text-anchor="end">sesión (o 401 si algo falla)</text>

  <rect class="nota" x="430" y="676" width="280" height="40" rx="3"/>
  <text class="notatxt" x="440" y="692">estampa la auditoría: usuario, app y equipo</text>
  <text class="notatxt" x="440" y="708">de la sesión, IP de la petición</text>

  <path class="msg" d="M420 740 H998"/>
  <text class="lbl" x="435" y="734">ejecuta la operación</text>

  <path class="ret" d="M420 768 H122"/>
  <text class="lblr" x="405" y="762" text-anchor="end">2xx · o 401 si el token no sirve</text>

  <!-- ===================== 3. cierre de sesión ===================== -->
  <rect class="fase" x="20" y="792" width="1080" height="22"/>
  <text class="fasetxt" x="32" y="807">3. Cierre de sesión · DELETE /api/sesiones/actual</text>

  <path class="msg" d="M120 842 H418"/>
  <text class="lbl" x="135" y="836">DELETE /api/sesiones/actual con el token</text>

  <path class="msg" d="M420 874 H718"/>
  <text class="lbl" x="435" y="868">verifica el token y cerrar(sesión)</text>

  <path class="msg" d="M720 906 H998"/>
  <text class="lbl" x="735" y="900">DELETE de su fila en seg_sesiones</text>

  <path class="ret" d="M420 938 H122"/>
  <text class="lblr" x="405" y="932" text-anchor="end">200 { cerrada: true }</text>
  <text class="fin" x="135" y="964">Desde aquí ese token responde 401, aunque no haya vencido.</text>
</svg>
